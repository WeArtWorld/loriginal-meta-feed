name: Meta catalog feed

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flux
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - run: python meta_flux_catalogue.py flux

      - name: Commit the new feed
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > flux/derniere-mise-a-jour.txt
          git config user.name "meta-feed-bot"
          git config user.email "meta-feed-bot@users.noreply.github.com"
          git add flux
          git commit -m "chore: refresh Meta catalog feed" || echo "No change"
          git push
